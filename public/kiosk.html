<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrintBox Kiosk</title>
<style>
:root{--bg:#07090f;--tx:#fff;--c:#19c3f0;--m:#ff2e93;--y:#ffd60a;--ok:#14b86a;--ln:#1a1f2e;--bd:#252b3d}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(circle at 20% 20%,#101728,#07090f 70%);color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;overflow:hidden}.stage{width:min(1400px,100vw);height:min(900px,100vh);display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}
.left,.right{background:rgba(255,255,255,.04);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--bd);border-radius:28px;padding:34px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}.left::before{content:"";position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.14;top:-180px;left:-180px;animation:drift 8s ease-in-out infinite alternate}.right::before{content:"";position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,var(--m),transparent 70%);opacity:.1;bottom:-150px;right:-150px;animation:drift 9s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,40px) scale(1.1)}}
.brand{font-size:22px;font-weight:800;display:flex;gap:10px;align-items:center}.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--c),var(--m));border:2px solid var(--y);box-shadow:0 4px 16px rgba(25,195,240,.35)}
.eyebrow{color:var(--c);font-weight:800;letter-spacing:2px;font-size:13px;text-transform:uppercase}.hero{font-size:64px;line-height:.95;font-weight:800;margin:18px 0 10px}.hero b{background:linear-gradient(90deg,var(--c),var(--m),var(--y));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:shimmer 4s linear infinite}@keyframes shimmer{to{background-position:200% center}}.sub{color:#b8c0d8;font-size:19px}.qr-zone{display:grid;place-items:center;padding:30px;margin:26px 0}.qr{width:min(260px,38vw);aspect-ratio:1;background:#fff;border-radius:18px;display:grid;place-items:center;position:relative;box-shadow:0 0 0 10px var(--y),0 24px 80px rgba(25,195,240,.28);animation:qrfloat 3s ease-in-out infinite}@keyframes qrfloat{50%{transform:translateY(-6px)}}.qr svg{width:78%;height:78%}.url{font-family:ui-monospace,Consolas,monospace;color:var(--y);font-size:17px;font-weight:700}.status{display:flex;gap:10px;align-items:center;background:rgba(20,184,106,.12);border:1px solid rgba(20,184,106,.4);color:var(--ok);padding:12px 14px;border-radius:16px;font-weight:800}.status.off{background:rgba(255,77,77,.1);border-color:rgba(255,77,77,.4);color:var(--danger)}.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:radar 1.6s infinite}.status.off .dot{background:var(--danger);animation:none}@keyframes radar{70%{box-shadow:0 0 0 12px rgba(20,184,106,0)}}
.clock{font-size:14px;color:#b8c0d8;font-weight:700;text-align:right}
.right{display:flex;flex-direction:column}.queue-title{font-size:22px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.queue-title small{color:#b8c0d8;font-weight:600}.queue{flex:1;margin-top:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.job{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:18px;padding:16px;animation:pop .5s;transition:border-color .4s,background .4s}.job .code{font-family:ui-monospace,Consolas,monospace;background:var(--y);color:#111;font-weight:800;padding:8px 12px;border-radius:10px;font-size:15px;transform:rotate(-2deg)}.job b{font-size:18px}.job small{color:#b8c0d8;display:block}.prog{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--m),var(--y),var(--c));background-size:300% 100%;animation:progflow 1.5s linear infinite;transition:width .5s}@keyframes progflow{to{background-position:100% 0}}.job.done{border-color:var(--ok);background:rgba(20,184,106,.06)}.job.active{border-color:var(--y);background:rgba(255,214,10,.05)}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:18px}.meta div{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}.meta b{display:block;font-size:24px}.meta small{color:#b8c0d8}.empty{color:#b8c0d8;text-align:center;padding:40px 10px;border:1px dashed var(--bd);border-radius:18px}.sticker{position:absolute;font-weight:800;border:2px solid #111;border-radius:10px;padding:5px 12px;background:var(--y);color:#111;box-shadow:3px 3px 0 #111}.sticker.a{top:24px;right:120px;transform:rotate(7deg)}.sticker.b{bottom:180px;left:20px;transform:rotate(-6deg);background:var(--c)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
@media(max-width:900px){.stage{grid-template-columns:1fr;height:auto}.hero{font-size:48px}.sticker{display:none}}
</style></head><body><div class="stage">
<section class="left"><div style="display:flex;justify-content:space-between;align-items:center"><div class="brand"><i></i> PrintBox</div><div class="clock" id="clock">--:--</div></div><div class="eyebrow" style="margin-top:34px">Smart printing kiosk</div><h1 class="hero">Scan. Upload.<br><b>Print it.</b></h1><p class="sub">No app, no queue. Upload from your phone and pick up pages here.</p><div class="qr-zone"><div class="qr"><svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#fff"/><g fill="#111"><rect x="8" y="8" width="26" height="26" rx="3"/><rect x="13" y="13" width="16" height="16" fill="#fff"/><rect x="17" y="17" width="8" height="8" fill="#111"/><rect x="66" y="8" width="26" height="26" rx="3"/><rect x="71" y="13" width="16" height="16" fill="#fff"/><rect x="75" y="17" width="8" height="8" fill="#111"/><rect x="8" y="66" width="26" height="26" rx="3"/><rect x="13" y="71" width="16" height="16" fill="#fff"/><rect x="17" y="75" width="8" height="8" fill="#111"/><rect x="38" y="10" width="6" height="6"/><rect x="52" y="20" width="6" height="6"/><rect x="42" y="42" width="16" height="16" rx="3" fill="#ff2e93"/><rect x="68" y="40" width="6" height="6"/><rect x="82" y="50" width="6" height="6"/><rect x="38" y="70" width="6" height="6"/><rect x="52" y="82" width="6" height="6"/><rect x="70" y="70" width="6" height="6"/><rect x="82" y="82" width="6" height="6"/></g></svg></div></div><div class="url" id="url">http://localhost:3000</div><div class="status" id="status"><span class="dot"></span> <span id="statusText">Connecting…</span></div><span class="sticker a">₹1/page</span><span class="sticker b">No queue</span></section>
<aside class="right"><div class="queue-title">Live queue <small id="count">0 jobs</small></div><div class="queue" id="queue"><div class="empty">Waiting for print jobs…</div></div><div class="meta"><div><b id="today">0</b><small>Today prints</small></div><div><b id="wait">0</b><small>Waiting</small></div><div><b id="ready">0</b><small>Ready</small></div></div></aside>
</div>
<script>
const API=location.origin+'/api';
async function load(){try{const r=await fetch(API+'/jobs');if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const jobs=d.jobs||d;render(jobs);stats(jobs)}catch(e){document.querySelector('#status').classList.add('off');document.querySelector('#statusText').textContent='Backend offline'}try{const m=await (await fetch(API+'/machines/M-01')).json();const x=m.machine||{};const st=document.querySelector('#status');st.classList.toggle('off',!x.isOnline);document.querySelector('#statusText').textContent=x.isOnline?('Machine M-01 · Ready · Paper: '+x.paperRemaining+' sheets'):'Machine M-01 · Offline'}catch(e){}}
function render(jobs){const q=document.querySelector('#queue');document.querySelector('#count').textContent=jobs.length+' jobs';if(!jobs.length){q.innerHTML='<div class="empty">Waiting for print jobs…</div>';return}q.innerHTML=jobs.slice(0,5).map(j=>{const pages=(j.options&&j.options.copies)||1;const amount=((j.pricing&&j.pricing.totalPrice)||0);const fname=j.file?(j.file.originalName||j.file.fileName):(j.fileName||'-');const pct=j.totalPhysicalPages?Math.min(100,((j.printedPages||0)/j.totalPhysicalPages)*100):0;return '<div class="job '+(j.status==='completed'?'done':j.status==='printing'?'active':'')+'"><span class="code">'+j.jobCode+'</span><div><b>'+pages+' pages · ₹'+amount.toFixed(2)+'</b><small>'+fname+'</small>'+(j.status==='printing'?'<div class="prog"><i style="width:'+pct+'%"></i></div>':'')+'</div><span>'+(j.status==='completed'?'Ready':j.status==='printing'?'Printing':'Waiting')+'</span></div>'}).join('')}
function stats(jobs){const today=new Date().toDateString();document.querySelector('#today').textContent=jobs.filter(j=>new Date(j.createdAt).toDateString()===today).length;document.querySelector('#wait').textContent=jobs.filter(j=>j.status!=='completed').length;document.querySelector('#ready').textContent=jobs.filter(j=>j.status==='completed').length}
function tick(){const d=new Date();document.querySelector('#clock').textContent=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000);
document.querySelector('#url').textContent=location.host;
load();setInterval(load,4000);
</script></body></html>
