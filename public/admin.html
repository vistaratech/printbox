<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrintBox Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--pn:#181b25;--tx:#f5f7ff;--mu:#9aa3bd;--ln:#282d3d;--bd:#343a4e;--m:#ff2e93;--c:#19c3f0;--y:#ffd60a;--ok:#14b86a;--warn:#ff8a00;--danger:#ff4d4d;--sh:#000}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(circle at 15% 15%,#141a28,#0f1117 70%);color:var(--tx);font:14px/1.45 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh}.wrap{max-width:1240px;margin:0 auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}.logo i{width:26px;height:26px;border:2px solid var(--y);border-radius:8px;background:linear-gradient(135deg,var(--c),var(--m));box-shadow:0 4px 16px rgba(25,195,240,.35)}.live{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border:1px solid var(--bd);font-weight:700}.live b{color:var(--ok)}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(20,184,106,.8);animation:pulse 1.8s infinite}.live.off b{color:var(--danger)}.live.off .dot{background:var(--danger);box-shadow:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(20,184,106,0)}}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;padding:16px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-2px);border-color:var(--c)}.card::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;opacity:.12}.card:nth-child(1)::after{background:var(--c)}.card:nth-child(2)::after{background:var(--m)}.card:nth-child(3)::after{background:var(--y)}.card:nth-child(4)::after{background:var(--ok)}.card small{color:var(--mu);display:block;font-size:12px}.card b{display:block;font-size:27px;margin-top:6px;font-weight:800}.card span.up{color:var(--ok);font-weight:700;font-size:12px}
.grid{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.panel{background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;padding:16px}.panel h2{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.panel h2 small{color:var(--mu);font-weight:500}.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--m),var(--y));transition:width .6s}.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}.id{font-family:ui-monospace,Consolas,monospace;font-weight:700;background:var(--ln);padding:3px 8px;border-radius:8px;font-size:12px}.muted{color:var(--mu)}.pill{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:800;background:var(--ln)}.pill.ok{background:rgba(20,184,106,.15);color:var(--ok)}.pill.run{background:rgba(25,195,240,.15);color:var(--c)}.pill.warn{background:rgba(255,138,0,.15);color:var(--warn)}.pill.bad{background:rgba(255,77,77,.15);color:var(--danger)}.empty{color:var(--mu);text-align:center;padding:20px}.actions{display:flex;gap:8px}.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--ln);color:var(--tx);font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}.btn.primary{background:var(--m);border-color:var(--m);color:#fff}.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:12px}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.btn{padding:8px 10px;font-size:12px}.id{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="logo"><i></i> PrintBox Admin</div><div class="live" id="live"><span class="dot"></span><b>Loading…</b></div><div class="actions"><button class="btn" id="refresh">Refresh</button></div></div>
<div class="cards">
  <div class="card"><small>Today Revenue</small><b id="rev">₹0.00</b><span id="revDelta"></span></div>
  <div class="card"><small>Today Prints</small><b id="prints">0</b><span id="printsDelta"></span></div>
  <div class="card"><small>Paper Remaining</small><b id="paper">—</b><span id="paperDelta"></span></div>
  <div class="card"><small>Failed Jobs</small><b id="failed">0</b><span id="failedDelta"></span></div>
</div>
<div class="grid">
 <section class="panel"><h2>Recent Jobs <small id="jobCount">0 total</small></h2><div class="bar"><i id="queueBar"></i></div><div id="jobs"></div></section>
 <aside class="panel"><h2>Machine Health</h2><div class="row"><span class="pill run" id="machPill">M-01</span><div><b id="machStatus">Checking…</b><br><small class="muted" id="machName">—</small></div></div><div class="row"><b>Paper</b><span class="muted" id="paperUsed">—</span></div><div class="row"><b>Queue</b><span class="muted" id="queueCount">0 waiting</span></div><div class="row"><b>Last heartbeat</b><span class="muted" id="lastHb">—</span></div></aside>
</div>
</div>
<script>
const $=s=>document.querySelector(s),API=location.origin+'/api';
const money=n=>'₹'+(+n||0).toFixed(2);
async function load(){try{const r=await fetch(API+'/jobs');if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const jobs=d.jobs||d;const arr=Array.isArray(jobs)?jobs:[];renderJobs(arr);renderStats(arr)}catch(e){$('#jobs').innerHTML='<div class="empty">Cannot load jobs. Backend not responding.</div>'}}
function renderJobs(jobs){const el=$('#jobs');if(!jobs.length){el.innerHTML='<div class="empty">No jobs yet</div>';$('#jobCount').textContent='0 total';$('#queueBar').style.width='0%';return}el.innerHTML=jobs.slice(0,8).map(j=>{const label=String(j.status||'unknown').replace(/_/g,' ');const cls=j.status==='completed'?'ok':j.status==='failed'?'bad':j.status==='printing'?'run':'warn';const pages=(j.options&&j.options.copies)||1;const amount=((j.pricing&&j.pricing.totalPrice)||0);const fname=j.file?(j.file.originalName||j.file.fileName):(j.fileName||'-');return '<div class="row"><span class="id">'+j.jobCode+'</span><div style="flex:1"><b>'+pages+' pages</b><br><small class="muted">'+fname+' · '+money(amount)+'</small></div><span class="pill '+cls+'">'+label+'</span></div>'}).join('');const waiting=jobs.filter(j=>j.status==='pending_payment'||j.status==='payment_received'||j.status==='queued').length;$('#jobCount').textContent=jobs.length+' total';$('#queueBar').style.width=Math.min(100,waiting*20)+'%';$('#queueCount').textContent=waiting+' waiting'}
function renderStats(jobs){const today=new Date().toDateString();const tj=jobs.filter(j=>new Date(j.createdAt).toDateString()===today);const revenue=tj.reduce((s,j)=>s+((j.pricing&&j.pricing.totalPrice)||0),0);const prints=tj.reduce((s,j)=>s+((j.options&&j.options.copies)||1),0);const failed=jobs.filter(j=>j.status==='failed').length;$('#rev').textContent=money(revenue);$('#prints').textContent=prints;$('#failed').textContent=failed;$('#revDelta').textContent='Today';$('#printsDelta').textContent='Today';$('#failedDelta').textContent=failed?'Needs attention':'Healthy';$('#failedDelta').style.color=failed?'var(--danger)':'var(--ok)'}
async function machine(){try{const d=await (await fetch(API+'/machines/M-01')).json();const m=d.machine||{};const live=$('#live');live.classList.toggle('off',!m.isOnline);live.querySelector('b').textContent=m.isOnline?'Live':'Offline';$('#machStatus').textContent=m.isOnline?'Online':'Offline';$('#machPill').className='pill '+(m.isOnline?'run':'bad');$('#machName').textContent=(m.name||'M-01')+(m.location?' · '+m.location:'');$('#paper').textContent=m.paperRemaining;const used=(m.maxPaperCapacity||500)-m.paperRemaining;$('#paperUsed').textContent=used+' / '+(m.maxPaperCapacity||500)+' used';$('#paperDelta').textContent='';$('#lastHb').textContent=m.lastHeartbeat?new Date(m.lastHeartbeat).toLocaleTimeString():'—'}catch(e){$('#live').classList.add('off');$('#live').querySelector('b').textContent='Offline';$('#machStatus').textContent='Offline';$('#machPill').className='pill bad';$('#paper').textContent='—';$('#paperUsed').textContent='—';$('#lastHb').textContent='—'}}
$('#refresh').onclick=()=>{load();machine()};
load();machine();setInterval(machine,8000);setInterval(load,6000);
</script></body></html>
